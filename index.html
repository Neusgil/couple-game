<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Couple Game | Juego de parejas</title>
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <main class="game">
      <header class="game__header">
        <h1>Couple Game</h1>
        <p>Encuentra las 15 parejas de colores</p>

        <div class="game__info">
          <p>Parejas: <span id="pairs">0</span> / 15</p>
          <p>Tiempo: <span id="timer">00:00</span></p>
        </div>
      </header>

      <section
        class="game__board"
        id="board"
        aria-label="Tablero del juego"
      ></section>

      <button class="game__restart" id="restart" type="button">
        Reiniciar partida
      </button>

      <p class="game__message" id="message" aria-live="polite"></p>
    </main>
  </body>
</html>
